# Snap of the prebuilt Linux app. .github/workflows/desktop-release.yml copies
# this folder to snap/ next to bundle/ (the flutter build linux output),
# replaces @VERSION@ and builds it with snapcore/action-build.
name: explorer
title: Explorer
base: core24
version: '@VERSION@'
summary: Open, edit and share almost any file
description: |
  Explorer is a file manager that opens over 300 file types inside the app:
  documents, e-books, comics, archives, photos, video, music, 3D models and
  code. It can annotate PDFs and edit Word, Excel and PowerPoint files, send
  files to nearby devices with LocalSend, share a folder over Wi-Fi and
  download videos with yt-dlp.
license: GPL-3.0-or-later
website: https://github.com/MSatyam-Mishra/explorer
issues: https://github.com/MSatyam-Mishra/explorer/issues
grade: stable
confinement: strict
platforms:
  amd64:

apps:
  explorer:
    command: explorer
    extensions: [gnome]
    environment:
      # Tesseract's English data, for text in images.
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/5/tessdata
    plugs:
      - home
      - removable-media
      - network
      - network-bind

parts:
  explorer:
    plugin: dump
    source: bundle
    stage-packages:
      # Video and audio playback (media_kit).
      - libmpv2
      # Text in images.
      - tesseract-ocr
      - tesseract-ocr-eng
