    - assets/viewer3d/three/jsm/libs/
    - assets/viewer3d/three/jsm/libs/basis/
    - assets/viewer3d/three/jsm/libs/draco/
    - assets/viewer3d/three/jsm/loaders/
    - assets/viewer3d/three/jsm/loaders/lwo/
    - assets/viewer3d/three/jsm/loaders/usd/
    - assets/viewer3d/three/jsm/math/
    - assets/viewer3d/three/jsm/utils/
