  file_picker: ^10.3.8
  shelf: ^1.4.1
  shelf_static: ^1.1.2
  installed_apps: ^2.1.0
  qr_flutter: ^4.1.0
  xml: ^6.5.0
  hugeicons: ^1.1.7
  liquid_glass_easy: 1.1.1
  syncfusion_flutter_pdfviewer: ^33.2.13
  syncfusion_flutter_pdf: ^33.2.13
